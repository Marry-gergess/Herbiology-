<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة علم النباتات السحرية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2c4a35;
            --secondary: #b89758;
            --bg-color: #1a2f23;
            --card-bg: #f4e8d2;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #2c4a35 0%, #1a2f23 100%);
            color: #e5e7eb;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, .magical-title { font-family: 'Amiri', serif; }

        /* Card Styles */
        .interactive-card {
            background-color: var(--card-bg);
            color: #2d3748;
            border: 2px solid var(--secondary);
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .interactive-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }

        .card-selected {
            border-color: #10b981 !important;
            background-color: #d1fae5 !important;
            transform: scale(0.98);
        }

        .card-wrong {
            border-color: #ef4444 !important;
            background-color: #fee2e2 !important;
            animation: shake 0.5s;
        }

        /* Drag & Drop Styles */
        .draggable-item {
            cursor: grab;
            user-select: none;
            transition: transform 0.2s;
        }
        .draggable-item:active { cursor: grabbing; transform: scale(1.1); }
        .draggable-item.used { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }
        
        .pot-container {
            border: 4px dashed #b89758;
            background-color: rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .pot-container.drag-over {
            background-color: rgba(184, 151, 88, 0.2);
            border-color: #d4af37;
            transform: scale(1.05);
        }
        
        .plant-emoji {
            font-size: 6rem;
            line-height: 1;
            transition: all 0.5s ease-in-out;
            display: inline-block;
        }
        
        .grow-animation {
            animation: growUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes growUp {
            0% { transform: scale(0.5) translateY(20px); opacity: 0; }
            50% { transform: scale(1.2) translateY(-10px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-magic {
            background: linear-gradient(135deg, var(--secondary), #8a6e3c);
            color: white;
            font-family: 'Amiri', serif;
            font-size: 1.25rem;
            border: 2px solid #fff;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            transition: all 0.3s;
        }
        .btn-magic:hover:not(:disabled) {
            background: linear-gradient(135deg, #8a6e3c, var(--secondary));
            transform: scale(1.05);
        }
        .btn-magic:disabled { opacity: 0.5; cursor: not-allowed; }

    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div id="game-container" class="max-w-4xl w-full bg-black/40 backdrop-blur-md rounded-2xl p-6 md:p-10 border border-[#b89758] shadow-2xl relative z-10">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl text-[#d4af37] mb-3 font-bold drop-shadow-md magical-title">
                <i class="fa-solid fa-leaf mr-2"></i> مغامرة الدفيئة الزجاجية
            </h1>
            <p class="text-lg text-gray-300">تحت إشراف البروفيسور ميركل س. بوتر</p>
            <div class="w-full bg-gray-700 rounded-full h-3 mt-6 hidden" id="progress-container">
                <div id="progress-bar" class="bg-[#d4af37] h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </header>

        <div id="screen-content" class="min-h-[400px] flex flex-col justify-center">
            <!-- سيتم حقن المحتوى هنا -->
        </div>

    </div>

    <script>
        const gameStages = [
            {
                id: 0,
                type: 'intro',
                title: "أهلاً بك أيها الساحر المتدرب",
                content: "اليوم لن نكتفي بقراءة الكتب المدرسية. لقد حان الوقت لدخول الدفيئة الزجاجية وتطبيق ما تعلمته في علم النباتات عملياً. هل أنت مستعد لاتخاذ القرارات الصحيحة وإنقاذ النباتات؟",
                buttonText: "دخول الدفيئة 🚪"
            },
            {
                id: 1,
                type: 'drag-grow',
                title: "المهمة العملية: زراعة روز كارولين",
                content: "أمامك أصيص يحتوي على جذور وردة في حالة سكون. اسحب الأدوات بالترتيب الصحيح فوق الأصيص لتنمو الوردة! <br><span class='text-[#d4af37] text-sm'>تلميح: السماد لإيقاظها، ثم الماء، ثم تعويذة النمو.</span>",
                tools: [
                    { id: 'water', name: 'الماء', icon: '💧', step: 2, errorMsg: 'يجب تسميد التربة أولاً لإخراجها من السكون!' },
                    { id: 'dung', name: 'روث التنين', icon: '💩', step: 1, errorMsg: 'لقد قمت بتسميدها بالفعل!' },
                    { id: 'spell', name: 'تعويذة النمو', icon: '✨', step: 3, errorMsg: 'النبتة جافة! اسقها بالماء أولاً قبل إلقاء التعويذة.' }
                ],
                plantPhases: ['🪵', '🌿', '🪴', '🌹'] // Branches -> Sprout -> Potted -> Blooming
            },
            {
                id: 2,
                type: 'sequence',
                title: "مهمة الحصاد: الناردين",
                content: "لجعل الحصاد آمناً، عليك استخدام <strong>تعويذة القطع (ديفيندو)</strong>. <br><span class='text-[#d4af37] font-bold'>اضغط على البطاقات بالترتيب الصحيح لتشكيل حركة العصا السحرية (حرف V):</span>",
                sequence: ['down', 'up', 'swish'],
                cards: [
                    { id: 'swish', text: '3. إنهاء بحركة سريعة', icon: 'fa-wand-sparkles' },
                    { id: 'down', text: '1. حركة العصا للأسفل', icon: 'fa-arrow-down' },
                    { id: 'up', text: '2. حركة العصا للأعلى', icon: 'fa-arrow-up' }
                ]
            },
            {
                id: 3,
                type: 'outro',
                title: "نجاح باهر! 🌟",
                content: "لقد أثبتّ جدارتك كعالم نباتات واعد. لقد زرعت الوردة بنجاح وحصدت الناردين باحترافية!<br><br>البروفيسور ميركل يمنح منزلك <strong>50 نقطة</strong>!",
                buttonText: "العب مرة أخرى ↺"
            }
        ];

        let currentStageIndex = 0;
        let sequenceStep = 0;
        let currentGrowthStep = 0; // For Drag and Drop stage

        const screenContent = document.getElementById('screen-content');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        function initGame() {
            currentStageIndex = 0;
            progressContainer.classList.add('hidden');
            renderStage();
        }

        function renderStage() {
            const stage = gameStages[currentStageIndex];
            screenContent.innerHTML = '';
            screenContent.className = 'animate-fade-in min-h-[400px] flex flex-col justify-center';
            
            if (stage.type !== 'intro' && stage.type !== 'outro') {
                progressContainer.classList.remove('hidden');
                progressBar.style.width = `${(currentStageIndex / (gameStages.length - 2)) * 100}%`;
            }

            const headerHtml = `
                <h2 class="text-3xl md:text-4xl magical-title text-center text-[#d4af37] mb-6">${stage.title}</h2>
                <p class="text-xl text-center text-gray-200 mb-8 leading-relaxed">${stage.content}</p>
            `;
            
            let interactiveHtml = '';

            if (stage.type === 'intro' || stage.type === 'outro') {
                interactiveHtml = `<div class="text-center"><button onclick="nextStage()" class="btn-magic">${stage.buttonText}</button></div>`;
                screenContent.innerHTML = headerHtml + interactiveHtml;
            } 
            else if (stage.type === 'drag-grow') {
                currentGrowthStep = 0;
                
                interactiveHtml = `
                <div class="flex flex-col md:flex-row gap-10 items-center justify-center mb-8">
                    <!-- Drop Zone (The Pot) -->
                    <div id="plant-pot" class="pot-container w-64 h-64 rounded-3xl flex flex-col items-center justify-center text-center p-4 relative" 
                         ondrop="dropItem(event)" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
                        <div id="plant-visual" class="plant-emoji mb-2">${stage.plantPhases[0]}</div>
                        <div class="text-gray-300 font-bold tracking-wider" id="pot-label">أصيص التربة</div>
                        <div class="absolute -bottom-4 bg-[#2c4a35] text-xs px-3 py-1 rounded-full text-white border border-[#d4af37]">اسحب المكونات هنا</div>
                    </div>

                    <!-- Tools (Draggables) -->
                    <div class="grid grid-cols-3 md:grid-cols-1 gap-4" id="tools-container">
                        ${stage.tools.map(tool => `
                            <div class="interactive-card draggable-item p-4 text-center flex flex-col items-center justify-center gap-2" 
                                 draggable="true" ondragstart="dragStart(event, '${tool.id}', ${tool.step}, '${tool.errorMsg}')" id="tool-${tool.id}" onclick="clickApplyTool('${tool.id}', ${tool.step}, '${tool.errorMsg}')">
                                <span class="text-4xl">${tool.icon}</span>
                                <span class="font-bold">${tool.name}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div id="feedback" class="text-center text-xl font-bold min-h-[40px] mb-6 p-4 rounded-lg hidden"></div>
                <div class="text-center"><button id="next-btn" onclick="nextStage()" class="btn-magic hidden">رائع! الوردة أزهرت ➔</button></div>
                `;
                screenContent.innerHTML = headerHtml + interactiveHtml;
            }
            else if (stage.type === 'sequence') {
                sequenceStep = 0;
                const shuffledCards = [...stage.cards].sort(() => Math.random() - 0.5);
                interactiveHtml = `<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">`;
                shuffledCards.forEach(card => {
                    interactiveHtml += `
                        <div onclick="handleSequence('${card.id}', this)" class="interactive-card p-6 flex flex-col items-center text-center gap-4">
                            <i class="fa-solid ${card.icon} text-4xl text-[#2c4a35]"></i>
                            <span class="font-bold">${card.text}</span>
                        </div>
                    `;
                });
                interactiveHtml += `</div>
                <div id="feedback" class="text-center text-xl font-bold min-h-[40px] mb-6 p-4 rounded-lg hidden"></div>
                <div class="text-center"><button id="next-btn" onclick="nextStage()" class="btn-magic hidden">المهمة التالية ➔</button></div>`;
                screenContent.innerHTML = headerHtml + interactiveHtml;
            }
        }

        // --- Drag and Drop Logic ---
        function allowDrop(ev) {
            ev.preventDefault();
            document.getElementById('plant-pot').classList.add('drag-over');
        }
        function leaveDrop(ev) {
            document.getElementById('plant-pot').classList.remove('drag-over');
        }
        function dragStart(ev, toolId, toolStep, errorMsg) {
            ev.dataTransfer.setData("toolId", toolId);
            ev.dataTransfer.setData("toolStep", toolStep);
            ev.dataTransfer.setData("errorMsg", errorMsg);
        }
        function dropItem(ev) {
            ev.preventDefault();
            document.getElementById('plant-pot').classList.remove('drag-over');
            
            const toolId = ev.dataTransfer.getData("toolId");
            const toolStep = parseInt(ev.dataTransfer.getData("toolStep"));
            const errorMsg = ev.dataTransfer.getData("errorMsg");
            
            processToolApplication(toolId, toolStep, errorMsg);
        }

        // Mobile Friendly Click Alternative
        function clickApplyTool(toolId, toolStep, errorMsg) {
            if(document.getElementById(`tool-${toolId}`).classList.contains('used')) return;
            processToolApplication(toolId, toolStep, errorMsg);
        }

        function processToolApplication(toolId, toolStep, errorMsg) {
            const feedbackEl = document.getElementById('feedback');
            const plantVisual = document.getElementById('plant-visual');
            const stageData = gameStages[currentStageIndex];

            feedbackEl.classList.remove('hidden');

            if (toolStep === currentGrowthStep + 1) {
                // Correct Step!
                currentGrowthStep++;
                
                // Update UI for the tool
                const toolEl = document.getElementById(`tool-${toolId}`);
                toolEl.classList.add('used');

                // Animate and change plant
                plantVisual.classList.remove('grow-animation');
                void plantVisual.offsetWidth; // Trigger reflow
                plantVisual.innerHTML = stageData.plantPhases[currentGrowthStep];
                plantVisual.classList.add('grow-animation');

                // Feedback messages
                if(currentGrowthStep === 1) {
                    feedbackEl.className = 'text-center text-lg font-bold min-h-[40px] mb-6 p-4 rounded-lg bg-green-900/50 text-green-300 border border-green-500';
                    feedbackEl.innerHTML = "✨ ممتاز! روث التنين أنعش التربة والوردة بدأت في الخروج من السكون.";
                } else if(currentGrowthStep === 2) {
                    feedbackEl.className = 'text-center text-lg font-bold min-h-[40px] mb-6 p-4 rounded-lg bg-green-900/50 text-green-300 border border-green-500';
                    feedbackEl.innerHTML = "💧 رائع! تشربت التربة الماء ونمت النبتة أكثر.";
                } else if(currentGrowthStep === 3) {
                    feedbackEl.className = 'text-center text-xl font-bold min-h-[40px] mb-6 p-4 rounded-lg bg-yellow-900/50 text-yellow-300 border border-yellow-500';
                    feedbackEl.innerHTML = "🌹 سحر مذهل! تفتحت وردة روز كارولين بالكامل بفضل تعويذتك.";
                    document.getElementById('next-btn').classList.remove('hidden');
                }
            } else {
                // Wrong Step
                document.getElementById('plant-pot').classList.add('card-wrong');
                setTimeout(() => document.getElementById('plant-pot').classList.remove('card-wrong'), 500);
                
                feedbackEl.className = 'text-center text-lg font-bold min-h-[40px] mb-6 p-4 rounded-lg bg-red-900/50 text-red-300 border border-red-500';
                feedbackEl.innerHTML = `❌ ${errorMsg}`;
            }
        }

        // --- Sequence Logic ---
        function handleSequence(cardId, element) {
            const stage = gameStages[currentStageIndex];
            const targetId = stage.sequence[sequenceStep];
            const feedbackEl = document.getElementById('feedback');

            if (cardId === targetId) {
                element.classList.add('card-selected');
                element.onclick = null;
                sequenceStep++;
                
                if (sequenceStep === stage.sequence.length) {
                    feedbackEl.classList.remove('hidden');
                    feedbackEl.className = 'text-center text-xl font-bold min-h-[40px] mb-6 p-4 rounded-lg bg-green-900/50 text-green-300 border border-green-500';
                    feedbackEl.innerHTML = `✨ <strong>ديفيندو!</strong> تم قطع الناردين بنجاح!`;
                    document.getElementById('next-btn').classList.remove('hidden');
                }
            } else {
                element.classList.add('card-wrong');
                feedbackEl.classList.remove('hidden');
                feedbackEl.className = 'text-center text-lg font-bold min-h-[40px] mb-6 p-4 rounded-lg bg-red-900/50 text-red-300 border border-red-500';
                feedbackEl.innerHTML = `❌ حركة خاطئة! (للأسفل، ثم للأعلى، ثم Swish). جرب مجدداً!`;
                setTimeout(() => renderStage(), 2000);
            }
        }

        function nextStage() {
            currentStageIndex++;
            if (currentStageIndex >= gameStages.length) initGame();
            else renderStage();
        }

        window.onload = initGame;
    </script>
</body>
</html>
